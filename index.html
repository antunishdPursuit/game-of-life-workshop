<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game of Life</title>
    <meta name="description" content="Conway's Game of Life in the browser. Draw cells or load a pattern, then press Play.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <div class="page">
        <header class="intro">
            <h1>Game of Life</h1>
            <p class="muted">Conway's cellular automaton. Click cells to draw, or load a pattern, then press Play.</p>
        </header>

        <main class="layout">
            <section class="board" aria-label="Grid">
                <div id="grid" class="grid" role="group" aria-label="Cells. Arrow keys move between cells; Space or Enter toggles one." aria-describedby="edge-note"></div>
                <p id="edge-note" class="muted small">Cells past the edge count as dead.</p>
            </section>

            <aside class="panel" aria-label="Controls">
                <div class="counter">
                    <span class="muted small">Generation</span>
                    <span id="generation" class="mono counter-value">0</span>
                </div>

                <button id="play" class="button primary" type="button">
                    <svg class="icon-play" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="6,4 16,10 6,16"/></svg>
                    <svg class="icon-pause" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="7" y1="4" x2="7" y2="16"/><line x1="13" y1="4" x2="13" y2="16"/></svg>
                    <span id="play-label">Play</span>
                </button>

                <div class="pair">
                    <button id="step" class="button secondary" type="button">Step</button>
                    <button id="clear" class="button secondary" type="button">Clear</button>
                </div>

                <div class="field">
                    <div class="field-row">
                        <label for="speed">Speed</label>
                        <output id="speed-value" for="speed" class="mono small muted">5 / s</output>
                    </div>
                    <input id="speed" type="range" min="1" max="20" value="5">
                </div>

                <div class="field">
                    <label for="pattern">Starter pattern</label>
                    <div class="pattern-row">
                        <select id="pattern">
                            <option value="block">Block</option>
                            <option value="blinker">Blinker</option>
                            <option value="glider" selected>Glider</option>
                        </select>
                        <button id="load" class="button secondary" type="button">Load</button>
                    </div>
                </div>
            </aside>
        </main>

        <p id="status" class="visually-hidden" role="status"></p>
        <noscript><p>This simulation needs JavaScript turned on.</p></noscript>
    </div>
</body>
</html>
